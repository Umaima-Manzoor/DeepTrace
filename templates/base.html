<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepTrace — Autonomous Fact-Checking Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>
  <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <!-- DeepTrace Logo: Shield + Magnifying Glass + Checkmark -->
        <svg class="logo-mark" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 3L4 9.5v9c0 8.5 5.96 16.44 14 18.5 8.04-2.06 14-10 14-18.5v-9L18 3z"
                fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="16" cy="17" r="5" stroke="currentColor" stroke-width="1.5"/>
          <line x1="19.5" y1="20.5" x2="24" y2="25" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M13.5 17l2 2 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        DeepTrace
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">
        <span class="sidebar-label">Infrastructure</span>
        <div class="sidebar-item"><span class="dot"></span> LLM Inference</div>
        <div class="sidebar-item"><span class="dot"></span> Reasoning Model</div>
        <div class="sidebar-item"><span class="dot"></span> Fast Model</div>
        <div class="sidebar-item"><span class="dot gold"></span> Web Search API</div>
      </div>

      <div class="sidebar-section">
        <span class="sidebar-label">Pipeline</span>
        <div class="sidebar-item">Claim Extraction</div>
        <div class="sidebar-item">Source Retrieval</div>
        <div class="sidebar-item">Cross-Reference</div>
        <div class="sidebar-item">Report Generation</div>
      </div>
    </nav>
  </aside>

  <div class="sidebar-overlay" onclick="document.querySelector('.sidebar').classList.remove('open')"></div>

  <main class="main">
    <div class="topbar">
      <span class="topbar-title">Autonomous Multi-Source Verification</span>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <footer class="footer">
        DeepTrace — Autonomous Multi-Source Fact-Checking Agent
    </footer>
  </main>
</body>
</html>
